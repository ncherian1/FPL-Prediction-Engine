# Scheduled ingestion. Requires repository secret DATABASE_URL (e.g. Supabase session pooler URL);
# optional PITCHAPI_API_KEY. Jobs are skipped when DATABASE_URL is not configured.
name: ingest
on:
  schedule:
    - cron: "15 */6 * * *"   # every 6h: FPL players, prices, ownership, injuries, fixtures
    - cron: "45 4 * * *"     # daily: + per-player histories, Football-Data, PitchAPI, reports
  workflow_dispatch:
    inputs:
      command:
        description: "fpl_engine command"
        default: "sync-fpl"
concurrency: ingest
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
      ARCHIVE_DIR: data/archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        if: env.DATABASE_URL != ''
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then CMD="${{ inputs.command }}";
          elif [ "${{ github.event.schedule }}" = "45 4 * * *" ]; then CMD=daily; else CMD=sync-fpl; fi
          python -m fpl_engine $CMD
      - name: Keep raw payload archive and reports
        if: always() && env.DATABASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ github.run_id }}
          path: data/
          retention-days: 90
          if-no-files-found: ignore
